<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 2.0 Secure Suite</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .card {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            text-align: center;
            width: 80%;
            max-width: 400px;
        }
        button {
            background-color: #6200ee;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }
        button:hover {
            background-color: #3700b3;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🔒 AI 2.0 Secure Suite</h2>
        <p style="color: #888;">Zero-Knowledge & Memory Purge Protected</p>
        <button onclick="clearAppMemory()">Wipe RAM & Cache Now</button>
        <p id="status" style="margin-top: 20px; color: #00ffcc;"></p>
    </div>

    <script src="app.js"></script>
</body>
</html>
