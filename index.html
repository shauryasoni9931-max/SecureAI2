<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 2.0 Secure Suite</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6200ee">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
        h1 {
            color: #bb86fc;
            text-align: center;
        }
        button {
            background-color: #03dac6;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-weight: bold;
        }
        button:hover {
            background-color: #01b0a1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 2.0 Secure Suite</h1>
        <p>Zero-Knowledge & Memory Purge Protected Mobile App</p>
        <button id="purgeBtn">Purge Memory</button>
    </div>

    <script src="app.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
      }
    </script>
</body>
</html>
